<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
    <!-- viewport-fit=cover: without it iOS reports env(safe-area-inset-*) as 0, so the
         kiosk's pinned footer never gets home-indicator clearance on notched iPhones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Sorbetes Apparel Studio — B2B custom-apparel manufacturing. Design, quote, and order custom tees, hoodies, and pants online or in-store."
    />
    <title>Sorbetes Apparel Studio</title>

    <!-- Type system: Archivo (display) + IBM Plex Mono (labels/mono).
         Anton is scoped to the walk-in kiosk's own theme, matching the
         sorbetes-walkin.html prototype's poster-style headlines — used by the walk-in
         kiosk itself (?page=walk-in), the shared QuoteSummary screen, and the instant
         builder (?page=direct-form), which was re-themed to match it 2026-08-11. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
